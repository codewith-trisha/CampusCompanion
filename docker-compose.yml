version: "3.9"

services:
  web:
    build: .
    command: gunicorn class_companion.wsgi:application --bind 0.0.0.0:8000 --workers 3
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - staticfiles:/app/staticfiles
      - vector_store:/app/vector_store
    restart: unless-stopped

volumes:
  staticfiles:
  vector_store:
