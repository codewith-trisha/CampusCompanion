<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}CampusCompanion{% endblock %}</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>

:root{
    --ink:#101a30;
    --ink-soft:#16223c;
    --ink-line:rgba(16,26,48,.08);
    --parchment:#f3ecdb;
    --parchment-card:#fbf8f0;
    --parchment-dark:#e7dcc0;
    --brass:#c9a44c;
    --brass-soft:#e4c983;
    --rust:#9a4530;
    --cream:#f6f1e4;
    --inktext:#1c1810;
    --muted:#7a7259;
    --mono:'IBM Plex Mono',monospace;
    --serif:'Fraunces',serif;
    --sans:'Inter',sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:var(--sans);
    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 38px,
            var(--ink-line) 39px
        ),
        var(--parchment);
    color:var(--inktext);
    min-height:100vh;
}

@media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
}

/* ============ TOP BAR ============ */

.topbar{
    position:sticky;
    top:0;
    z-index:30;
    background:linear-gradient(155deg,#122040,#0d1730 60%,#101c38);
    border-bottom:1px solid rgba(201,164,76,.3);
    box-shadow:0 12px 30px rgba(0,0,0,.25);
}

.topbar-inner{
    max-width:1240px;
    margin:0 auto;
    padding:14px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.topbar-brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.topbar-crest{width:38px;height:38px;flex:none;}

.topbar-word{
    font-family:var(--serif);
    font-size:19px;
    font-weight:600;
    color:var(--cream);
    letter-spacing:.2px;
}

.topbar-right{
    display:flex;
    align-items:center;
    gap:22px;
}

.topbar-user{
    text-align:right;
    line-height:1.25;
}
.topbar-user .name{
    font-size:13.5px;
    font-weight:600;
    color:var(--cream);
}
.topbar-user .meta{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.06em;
    color:var(--brass-soft);
}

.topbar-logout{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#c9c2a8;
    border:1px solid rgba(246,241,228,.25);
    border-radius:999px;
    padding:7px 14px;
    text-decoration:none;
    transition:.2s;
    white-space:nowrap;
}
.topbar-logout:hover{
    color:var(--cream);
    border-color:var(--rust);
    background:rgba(154,69,48,.25);
}

/* ============ PAGE SHELL ============ */

.page{
    max-width:1240px;
    margin:0 auto;
    padding:38px 28px 60px;
}

/* ============ SHARED CARD SYSTEM ============ */

.panel{
    background:var(--parchment-card);
    border:1px solid var(--parchment-dark);
    border-radius:10px;
    padding:24px;
    box-shadow:0 10px 26px rgba(16,26,48,.06);
}

.panel-rule{
    height:3px;
    width:44px;
    background:var(--brass);
    border-radius:2px;
    margin-bottom:14px;
}

.eyebrow{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
}

.panel h1,.panel h2{
    font-family:var(--serif);
    font-weight:600;
    color:var(--inktext);
}

.stat-num{
    font-family:var(--mono);
    font-size:32px;
    font-weight:500;
    line-height:1;
}

.pill{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    border-radius:999px;
    padding:3px 10px;
    display:inline-block;
}
.pill-brass{background:rgba(201,164,76,.16);color:#8a6b1f;}
.pill-rust{background:rgba(154,69,48,.12);color:var(--rust);}
.pill-muted{background:rgba(16,26,48,.06);color:var(--muted);}

.list-row{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:10px 0;
    border-top:1px dashed var(--parchment-dark);
    font-size:13.5px;
}
.list-row:first-of-type{border-top:none;}
.list-row .code{
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--rust);
    margin-right:8px;
}

.btn-primary{
    font-family:var(--sans);
    font-weight:600;
    font-size:14px;
    padding:11px 18px;
    background:var(--ink);
    color:var(--cream);
    border:none;
    border-radius:6px;
    cursor:pointer;
    transition:background .2s ease;
}
.btn-primary:hover{background:var(--rust);}

.field-input{
    width:100%;
    font-family:var(--sans);
    font-size:14.5px;
    padding:11px 14px;
    background:#fffdf8;
    border:1px solid var(--parchment-dark);
    border-radius:6px;
    color:var(--inktext);
    outline-offset:2px;
}
.field-input:focus{outline:2px solid var(--rust);border-color:var(--rust);}

@media(max-width:640px){
    .topbar-user{display:none;}
}
</style>
{% block extra_head %}{% endblock %}
</head>

<body>

<header class="topbar">
    <div class="topbar-inner">
        <div class="topbar-brand">
            <svg class="topbar-crest" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="46" fill="none" stroke="#c9a44c" stroke-width="3"/>
                <circle cx="50" cy="50" r="38" fill="none" stroke="#c9a44c" stroke-width="1.4" opacity=".6"/>
                <text x="50" y="59" text-anchor="middle" font-family="Fraunces, serif" font-size="32" font-weight="600" fill="#f6f1e4">CA</text>
            </svg>
            <span class="topbar-word">CampusCompanion</span>
        </div>
        <div class="topbar-right">
            {% block topbar_user %}{% endblock %}
            <a href="{% url 'logout' %}" class="topbar-logout">Log out</a>
        </div>
    </div>
</header>

<main class="page">
    {% block content %}
    {% endblock %}
</main>

</body>
</html>
